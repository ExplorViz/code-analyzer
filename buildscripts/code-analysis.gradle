apply plugin: 'checkstyle'
apply plugin: 'jacoco'

jacocoTestReport {

  executionData { tasks.withType(Test).findAll { it.jacoco.destinationFile.exists() }*.jacoco.destinationFile }

  reports {
    xml.required = true
    html.required = true
  }
}

checkstyle {
  configDirectory = file("code-analysis")
  configFile = file("code-analysis/checkstyle.xml")
  maxWarnings = 0
  ignoreFailures = false
  toolVersion = "10.12.5"
}

def antlrCheckstyleExcludes = [
  '**/TypeScriptLexerBase.java',
  '**/TypeScriptParserBase.java',
  '**/PythonLexerBase.java',
  '**/PythonParserBase.java',
  '**/PythonVersion.java',
  '**/CParserBase.java',
  '**/CLexerBase.java',
  '**/Symbol.java',
  '**/SymbolTable.java',
  '**/TypeClassification.java',
  '**/GoParserBase.java',
  '**/CSharpLexerBase.java',
  '**/CSharpParserBase.java',
  '**/RustLexerBase.java',
  '**/RustParserBase.java',
  '**/PhpLexerBase.java',
  '**/SwiftSupport.java',
  '**/SwiftSupportLexer.java',
]

// Exclude ANTLR generated base classes from checkstyle (external files from ANTLR repository)
tasks.withType(Checkstyle) {
  antlrCheckstyleExcludes.each { exclude it }
}

spotless {
  java {
    target 'src/*/java/**/*.java'
    targetExclude antlrCheckstyleExcludes
    googleJavaFormat()
    removeUnusedImports()
    trimTrailingWhitespace()
    endWithNewline()
  }
}
