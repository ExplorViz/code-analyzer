default:
  tags:
    - exec-docker
  image: ghcr.io/graalvm/graalvm-community:21
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .gradle
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

stages:
  - build
  - code-analysis
  - test
  - publish

build:
  stage: build
  script: ./gradlew assemble
  artifacts:
    expire_in: 1 week
    paths:
      - build/libs/

spotless:
  stage: code-analysis
  script: ./gradlew spotlessCheck

checkstyle:
  stage: code-analysis
  script:
    - |
      set +e
      ./gradlew checkstyleMain --continue
      CHECKSTYLE_EXIT=$?
      python3 code-analysis/ci/gitlab-code-quality.py build/reports/checkstyle/main.xml build/reports/ci/checkstyle-code-quality.json
      python3 code-analysis/ci/report-summary.py build/reports/checkstyle/main.xml
      exit $CHECKSTYLE_EXIT
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      codequality: build/reports/ci/checkstyle-code-quality.json
    paths:
      - build/reports/checkstyle/
      - build/reports/ci/checkstyle-code-quality.json

unit-test:
  stage: test
  script:
    - |
      set +e
      ./gradlew test jacocoTestReport --continue
      TEST_EXIT=$?
      python3 code-analysis/ci/report-summary.py junit build/test-results/test
      exit $TEST_EXIT
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test/
      - build/reports/jacoco/test/html/
      - build/reports/jacoco/test/jacocoTestReport.xml

.push-dockerhub-base-job:
  stage: publish
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  script:
    - ./gradlew clean assemble
      -Dquarkus.container-image.build=true
      -Dquarkus.container-image.push=true
      -Dquarkus.container-image.additional-tags=$CI_COMMIT_SHORT_SHA
      -Dquarkus.container-image.username=$DOCKERHUB_USERNAME
      -Dquarkus.container-image.password=$DOCKERHUB_PASSWORD
  after_script:
    - echo "Image was uploaded to Dockerhub; explorviz/${DOCKERHUB_IMAGE_NAME}:latest and explorviz/${DOCKERHUB_IMAGE_NAME}:$CI_COMMIT_SHORT_SHA"

push-dockerhub-mr:
  stage: publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - ./gradlew clean assemble
      -Dquarkus.container-image.build=true
      -Dquarkus.container-image.push=true
      -Dquarkus.container-image.tag=mr-$CI_MERGE_REQUEST_IID
      -Dquarkus.container-image.username=$DOCKERHUB_USERNAME
      -Dquarkus.container-image.password=$DOCKERHUB_PASSWORD
  after_script:
    - echo "Image was uploaded to Dockerhub; explorviz/${DOCKERHUB_IMAGE_NAME}:mr-$CI_MERGE_REQUEST_IID"
