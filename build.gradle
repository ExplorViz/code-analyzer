plugins {
    id 'java'
    id 'io.quarkus'
    id 'com.adarshr.test-logger' version '4.0.0'
    id 'eclipse'
    id "org.kordamp.gradle.jandex" version "2.3.0"
    id 'antlr'
    id 'com.diffplug.spotless' version '8.10.4'
}

apply from: 'buildscripts/code-analysis.gradle'

repositories {
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-container-image-jib'
    implementation 'io.quarkus:quarkus-vertx'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-grpc'

    // GraphQL Client
    implementation 'io.quarkus:quarkus-smallrye-graphql-client'

    implementation 'com.google.protobuf:protobuf-java-util'

    // Java Parsing
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.28.2'

    // ANTLR
    antlr 'org.antlr:antlr4:4.13.2'
    implementation 'org.antlr:antlr4-runtime:4.13.2'

    // Git
    // Quarkus extension for JGit, provides the native image configuration for JGit
    implementation 'io.quarkiverse.jgit:quarkus-jgit:3.7.0'

    // otel
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp-logs:1.22.0-alpha'
    implementation 'io.opentelemetry:opentelemetry-proto:1.7.1-alpha'

    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.quarkus:quarkus-junit-mockito'
    testImplementation 'io.rest-assured:rest-assured'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.grpc:grpc-testing'
    // Reference for the code metrics
    testImplementation('com.puppycrawl.tools:checkstyle:14.4.0') {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
}

group = 'net.explorviz'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/classes/java/quarkus-generated-sources/grpc'
            srcDirs 'build/generated-src/antlr/main'
        }
    }
}

// ANTLR configuration
def antlrLanguages = [
    'java'       : 'net.explorviz.code.analysis.antlr.generated.java',
    'cpp'        : 'net.explorviz.code.analysis.antlr.generated.cpp',
    'c'          : 'net.explorviz.code.analysis.antlr.generated.c',
    'golang'     : 'net.explorviz.code.analysis.antlr.generated.golang',
    'csharp'     : 'net.explorviz.code.analysis.antlr.generated.csharp',
    'rust'       : 'net.explorviz.code.analysis.antlr.generated.rust',
    'kotlin'     : 'net.explorviz.code.analysis.antlr.generated.kotlin',
    'php'        : 'net.explorviz.code.analysis.antlr.generated.php',
    'swift'      : 'net.explorviz.code.analysis.antlr.generated.swift',
    'python'     : 'net.explorviz.code.analysis.antlr.generated.python',
    'typescript' : 'net.explorviz.code.analysis.antlr.generated.typescript',
]

tasks.named('generateGrammarSource').configure {
    enabled = false
}

def generateGrammarTasks = antlrLanguages.collect { folder, pkg ->
    def taskName = "generate${folder.capitalize()}GrammarSource"
    tasks.register(taskName, org.gradle.api.plugins.antlr.AntlrTask) {
        source = fileTree("src/main/antlr/${folder}")
        outputDirectory = file("build/generated-src/antlr/main/${pkg.replace('.', '/')}")
        arguments = ['-visitor']
        packageName = pkg
        antlrClasspath = configurations.antlr
    }
    return taskName
}

// Ensure ANTLR generates before compilation
tasks.named('compileJava') {
    dependsOn generateGrammarTasks
}

// Regarding jandex dependency for each task
// https://github.com/kordamp/jandex-gradle-plugin/issues/9

tasks.named('checkstyleMain') {
    dependsOn 'jandex'
}

tasks.named('spotlessCheck') {
    dependsOn 'jandex'
}

tasks.named('compileTestJava') {
    dependsOn 'jandex'
}

tasks.named('test') {
    dependsOn 'jandex'
}

tasks.named('quarkusDependenciesBuild') {
    dependsOn 'jandex'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-parameters'
    // Turn on all javac warnings except classfile and processing, which produces many false-positives about annotations
    options.compilerArgs << "-Xlint:all" << "-Xlint:-classfile" << "-Xlint:-processing"
}

test {
    useJUnitPlatform()
    testLogging.showStandardStreams = true
    systemProperty 'updateGoldenFiles', System.getProperty('updateGoldenFiles', 'false')
}
