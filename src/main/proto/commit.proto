syntax = "proto3";

option java_multiple_files = true;
option java_package = "net.explorviz.code.proto";
option java_outer_classname = "CommitProto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "contributor.proto";

service CommitService {
  rpc PersistCommit (CommitData) returns (google.protobuf.Empty) {}
}

message CommitData {
  string landscape_token = 1;
  string repository_name = 2;
  string commit_id = 3;
  string parent_commit_id = 4;
  google.protobuf.Timestamp author_date = 5;
  google.protobuf.Timestamp commit_date = 6;
  string branch_name = 7;
  repeated string tags = 8;

  // Author association data
  ContributorData author = 9;

  // Number of files that are analyzed for this commit.
  int32 analysis_file_count = 10;

  // Git file metrics
  repeated FileIdentifier added_files = 11;
  repeated FileIdentifier modified_files = 12;
  repeated FileIdentifier deleted_files = 13;
  repeated FileIdentifier unchanged_files = 14;

  // All git parent commits, oldest-to-newest analysis order is derived from these links.
  repeated string parent_commit_ids = 15;

  // Files git detected as moved relative to the parent commit. Every entry is also reported as
  // a deleted file (old_file) and an added file (new_file), so receivers that do not know about
  // renames keep working and simply see a deletion and an addition.
  repeated FileRename renamed_files = 16;
}

message FileRename {
  FileIdentifier old_file = 1;
  FileIdentifier new_file = 2;

  // Content similarity in percent (100 = identical content, i.e. a pure move).
  int32 similarity = 3;
}

message FileIdentifier {
  string file_hash = 1;

  // Path relative to root of repository
  string file_path = 2;
}
